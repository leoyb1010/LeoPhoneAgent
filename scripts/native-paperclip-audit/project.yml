name: PaperclipNativeAudit
options:
  # 与主 App 的 IPHONEOS_DEPLOYMENT_TARGET 保持一致（src/ios/LeoPhoneAgent.xcodeproj）。
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PaperclipNativeAudit:
    type: application
    platform: iOS
    sources:
      - path: ../../src/ios/Agent/Paperclip
      - path: ../../src/ios/Views/Paperclip
      # 新界面使用的端侧设计系统（无其他依赖，可独立编译）。
      - path: ../../src/ios/Shared/LeoDesignSystem.swift
      - path: ../../src/ios/Shared/LeoMotionEffects.swift
      - path: ../../src/ios/Views/Chat/ChatColors.swift
      # F 统一外壳/空状态/流光（只依赖 SwiftUI + LeoDesignSystem）。
      - path: ../../src/ios/Views/Components
      - path: AuditApp.swift
      - path: FixtureServer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leoyuan.paperclip-native-audit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  PaperclipNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../src/ios/Agent/Paperclip
      - path: ../../src/ios/Views/Paperclip
      - path: ../../src/ios/Shared/LeoDesignSystem.swift
      - path: ../../src/ios/Shared/LeoMotionEffects.swift
      - path: ../../src/ios/Views/Chat/ChatColors.swift
      - path: ../../src/ios/Views/Components
      - path: ../../src/ios/MinisTests/PaperclipContractTests.swift
      - path: ../../src/ios/MinisTests/PaperclipClientTests.swift
      - path: ../../src/ios/MinisTests/PaperclipLiveTests.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leoyuan.paperclip-native-audit.tests
        TEST_HOST: ""
  PaperclipNativeJourneys:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PaperclipNativeAudit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leoyuan.paperclip-native-audit.journeys
        TEST_TARGET_NAME: PaperclipNativeAudit
schemes:
  PaperclipNativeAudit:
    build:
      targets:
        PaperclipNativeAudit: all
        PaperclipNativeTests: [test]
        PaperclipNativeJourneys: [test]
    test:
      gatherCoverageData: true
      targets:
        - PaperclipNativeTests
        - PaperclipNativeJourneys
