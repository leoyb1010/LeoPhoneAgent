name: Android product UI fixture
on:
  push:
    branches: [audit/five-round-product-20261004]
    paths:
      - 'src/android/**'
      - 'scripts/android-product-audit/**'
      - '.github/workflows/android-product-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-picker:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install official Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - name: Actual production Compose sheet on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-product-audit/run.sh
      - name: Preserve screenshots and test evidence, never APKs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-product-ui-fixture
          path: android-product-audit-results/**
          if-no-files-found: error
          retention-days: 14
