# 最小 CI:MinisTests 单测。守住"重复声明进编译目标"这类必炸问题
# (2026-08 审计发现 5 个 ' 2.swift' 让测试 target 断编译逾两周无人知)。
#
# [T-ci-honest-green] 这个文件本身曾是"假绿"的根:
#   xcodebuild ... 2>&1 | tail -30
# 管道的退出码只看最后一条命令(tail 永远成功),所以 xcodebuild 失败
# 时整步仍返回 0,GitHub 显示绿灯 —— 编译失败、测试失败、依赖缺失全被
# 一条 tail 吞掉。绿灯变得毫无意义。修法见下:pipefail + 不截断退出码。
name: LeoPhoneAgent Quality
on:
  push:
    branches: [main]
    # 触发面放宽:Python 服务、脚本、协议、工作流本身的改动也要能触发,
    # 否则改中继/发布脚本 CI 完全不看,等于没有。
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/audits/**'
      - 'README.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
# 只读即可:本工作流只跑测试和审计,不写仓库。不声明就继承仓库默认权限,
# 默认可能是可写的 —— 当年 android.yml 早就声明了,这里一直漏。
permissions:
  contents: read
jobs:
  ios-static-audits:
    # [up-b-ci] 不需要 Xcode 的 iOS 审计留在 GitHub 托管机,PR 也跑(公开仓库,PR 不能碰自托管机)。
    # 这几项在托管机上一直是绿的(只用 shell/rg/node/python);坏的是需要 Xcode 27 的那半,见下一个 job。
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS audit tooling
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Audit iOS release, motion, visible controls, tokens and perf gate
        run: |
          set -euo pipefail
          # Independent fixtures must all run so one failure cannot hide
          # another. Keep the step red if any command fails.
          failed=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "Check passed: $*"
            else
              result=$?
              echo "::error::Check failed (exit $result): $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check ./scripts/IOSReleaseReadinessAudit.sh
          run_check ./scripts/IOSAccessibilityMotionAudit.sh
          run_check ./scripts/IOSVisibleControlAudit.sh
          # LeoBot Design token 单一来源(WP-30):生成文件与 design/tokens.json 不一致就红。
          run_check node design/gen-tokens.mjs --check
          run_check python3 scripts/RepositoryEntryPointAudit.py
          run_check python3 scripts/IOSPerfBudgetGateTests.py
          exit "$failed"

  ios-unit-tests:
    # 项目 deployment target 自 WP-40(iOS 1.75.0)起是 iOS/watchOS 27.0,必须用 Xcode 27
    # + iOS 27 Simulator;Xcode 26.x 解析 target 就会失败。
    # [up-b-ci] GitHub 托管 macOS 镜像没有 Xcode 27:旧配置硬写
    # DEVELOPER_DIR=/Applications/Xcode_27.1.app,托管机上不存在,xcrun 报
    # "missing DEVELOPER_DIR path",每次 push 都红。改到用户 Mac Studio 上的自托管 runner
    # (leomac-studio);Xcode 用 runner 自己的 xcode-select(Studio 上是 /Applications/Xcode.app),不再硬写路径。
    #
    # 安全:仓库是公开的。fork 的 PR 一旦落到自托管机,就是在用户的 Studio 上执行陌生代码。
    # 所以这个 job 永远不在 pull_request 上跑(只 push 到 main / 手动 dispatch,二者都要写权限)。
    # 不要去掉这个 if,也不要改用 pull_request_target。
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, leobot-studio, xcode27]
    # 只有一台 Studio runner,job 天然串行排队,不会并行抢模拟器。不加 concurrency 组:
    # 它会把排队中的旧运行标成 cancelled,LeoCIStatus 会把那些提交判成 FAIL。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain (must be Xcode 27)
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          if [ "${major:-0}" -lt 27 ]; then
            echo "::error::self-hosted runner has Xcode ${major:-?}, need 27+ (deployment target iOS 27.0)"; exit 1
          fi
      - name: Swift and SDK core tests
        run: |
          set -euo pipefail
          # Independent fixtures must all run so one SDK failure cannot hide
          # another. Keep the step red if any command fails.
          failed=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "Check passed: $*"
            else
              result=$?
              echo "::error::Check failed (exit $result): $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check ./scripts/RunCoreSecurityTests.sh
          run_check python3 scripts/CoreExecutionSmoke.py -v
          run_check python3 scripts/CloudKitInboundDurabilityTests.py -v
          run_check bash scripts/CloudKitTransportSDKTypecheck.sh
          run_check python3 scripts/SyncBoundaryTests.py -v
          run_check bash scripts/SkillArchiveCompressionTests.sh
          run_check python3 scripts/SkillTreeTransactionTests.py
          run_check python3 scripts/CloudKitDependencyProgressTests.py
          run_check python3 scripts/SessionFileDeletionPendingTests.py
          run_check python3 scripts/CloudKitUnknownRecordRetentionTests.py
          run_check python3 scripts/SyncSQLiteDurabilityTests.py
          exit "$failed"
      - name: Run MinisTests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail        # 管道里任一命令失败即失败,不被 tail 掩盖
          # 只复用现有模拟器(有本机策略脚本就用白名单,否则挑 iOS 27 的 iPhone),绝不创建设备。
          udid=$(python3 scripts/CISelectIOSSimulator.py)
          # 专用 DerivedData 放在 runner 的 _temp 下,每次清空;不碰 ~/Library/Developer/Xcode/DerivedData。
          derived="$RUNNER_TEMP/leobot-minis-derived-data"
          log="$RUNNER_TEMP/xcodebuild-minis.log"
          rm -rf "$derived"
          cd src/ios
          # 逻辑测试必须真正独立于 App/Watch/iSH:这样 CI 既不被缺失的
          # watchOS runtime 卡死，也不依赖尚未发布的本地 iSH submodule commit。
          # 完整 App + 原生依赖另走 release gate，不能拿来替代快速单测。
          xcodebuild test -project LeoPhoneAgent.xcodeproj -scheme MinisLogicTests \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$derived" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:MinisTests CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee "$log" \
            || { echo "::error::xcodebuild test failed"; tail -60 "$log"; exit 1; }
          # 双保险:日志里出现测试失败标记也判红(某些配置下 xcodebuild
          # 退出码不可靠)。
          if grep -qE "Testing failed|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*" "$log"; then
            echo "::error::found failure markers in xcodebuild log"; exit 1
          fi
      - name: Clean DerivedData
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/leobot-minis-derived-data"

  native-model-audit:
    name: Native model UI (${{ matrix.label }}, ${{ matrix.device }})
    # Test-only fixtures, no app signing, credentials, submodules, or releases.
    # Three macOS simulator legs (35-45 min each): run on demand only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: ${{ matrix.timeout }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            source_ref: WORKTREE
            device: iPhone
            timeout: 35
          - label: baseline
            source_ref: 3c053a7c9b112667a04cea9b12c7c16a03c5ce39
            device: iPhone
            timeout: 35
          - label: current-ipad
            source_ref: WORKTREE
            device: iPad
            timeout: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native harness project generator
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Select actual simulator device family
        env:
          AUDIT_DEVICE_FAMILY: ${{ matrix.device }}
        run: |
          if [[ "$AUDIT_DEVICE_FAMILY" == "iPad" ]]; then
            SIMULATOR=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices=[d for runtime,items in json.load(sys.stdin)["devices"].items() if "iOS-26-5" in runtime for d in items if d["name"].startswith("iPad")]
          if not devices: raise SystemExit("No available native iPad on pinned iOS26.5 runtime")
          print(sorted(devices,key=lambda d:d["name"])[0]["udid"])
          ')
            echo "NATIVE_AUDIT_DESTINATION=platform=iOS Simulator,id=$SIMULATOR" >> "$GITHUB_ENV"
          else
            echo "NATIVE_AUDIT_DESTINATION=platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0" >> "$GITHUB_ENV"
          fi
      - name: Test production SwiftUI model views on ${{ matrix.device }} Simulator
        run: bash scripts/native-model-audit/run.sh '${{ matrix.source_ref }}' '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-model-audit-${{ matrix.label }}
          path: |
            native-model-audit-results/${{ matrix.label }}/
            !native-model-audit-results/${{ matrix.label }}/DerivedData/**
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-model-audit-images-${{ matrix.label }}
          path: |
            native-model-audit-results/${{ matrix.label }}/images/
            native-model-audit-results/${{ matrix.label }}/source-manifest.json
            native-model-audit-results/${{ matrix.label }}/test-summary.json
            native-model-audit-results/${{ matrix.label }}/test-scope.txt
            native-model-audit-results/${{ matrix.label }}/**/attachments/*.txt
          if-no-files-found: warn
          retention-days: 14

  mac-quality:
    name: Current Mac 1.x source checks
    env:
      ZCODE_ENV: production
      ZCODE_PRODUCT_IDENTITY: leo
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/mac/leophone
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: src/mac/leophone/pnpm-lock.yaml
      - name: Install exact current Mac dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI contracts required by the desktop host
        run: pnpm --filter '@zcode/contracts...' build
      - name: Typecheck current Mac app and CLI
        run: |
          set -euo pipefail
          pnpm typecheck
          PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir apps/zcode-cli typecheck
      - name: Lint and architecture gate
        run: |
          set -euo pipefail
          pnpm lint
          pnpm architecture:check
      - name: Current Mac regression tests
        run: |
          set -euo pipefail
          pnpm leo:test:agent
          node --import tsx --test $(find packages/desktop/src/host -name '*.test.ts' -print)
          node --import tsx --test packages/ui/test/phonePairingSession.test.ts packages/ui/test/leoStatusRows.test.ts packages/ui/test/taskListLoadCoordinator.test.ts
      - name: Synthetic phone-pairing component journeys and screenshots
        run: |
          set -euo pipefail
          node node_modules/playwright-core/cli.js install chromium
          node scripts/audit-phone-link/run-journeys.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: phone-pairing-synthetic-ui
          path: src/mac/leophone/audit-phone-link-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Build current Mac source (distribution assets gated separately)
        run: |
          set -euo pipefail
          PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir apps/zcode-cli build
          pnpm build:bootstrap
      - name: Mac vitest known-failure ratchet
        # 全量 vitest(test:unit 口径);失败必须在 scripts/leo-vitest-known-failures.json 里,
        # 否则红。放在构建之后:部分用例依赖 @zcode/e2e-report、@zcode/adapters 的 dist。
        run: pnpm leo:test:vitest-ratchet

      # [up-b-ci] 原来这里还有一步 "Actual full Web renderer on isolated local services"
      # (scripts/audit-full-renderer/run-journeys.mjs:起 packages/server 的 HTTP 服务 + packages/web)。
      # wp-11(d166d86c)删掉了 packages/server、packages/web 和这个脚本,工作流这一步没跟着删,
      # 之后每次都是 MODULE_NOT_FOUND。被测对象已不存在,所以删步骤;桌面端的真实旅程见下一步。
      - name: Actual unpackaged Mac desktop and WindowController journeys
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: node scripts/audit-full-renderer/run-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: actual-full-renderer-synthetic-journeys
          path: |
            src/mac/leophone/audit-full-renderer-results/*.png
            src/mac/leophone/audit-full-renderer-results/*.txt
            src/mac/leophone/audit-full-renderer-results/*.json
            src/mac/leophone/audit-full-renderer-results/*.log
            src/mac/leophone/audit-full-renderer-results/desktop/*.png
            src/mac/leophone/audit-full-renderer-results/desktop/*.txt
            src/mac/leophone/audit-full-renderer-results/desktop/*.json
            src/mac/leophone/audit-full-renderer-results/desktop/*.log
          if-no-files-found: error
          retention-days: 14

  relay-tests:
    name: Active relay protocol and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install relay test dependencies
        run: python -m pip install aiohttp
      - name: Test relay
        run: |
          PYTHONPATH=src/mac python -m unittest discover -s src/mac/leoagent -t src/mac -p 'test_relay*.py' -v
          PYTHONPATH=src/mac python -m unittest discover -s src/mac/leoagent -t src/mac -p 'test_live_activity.py' -v
