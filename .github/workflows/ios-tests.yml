# 最小 CI:MinisTests 单测。守住"重复声明进编译目标"这类必炸问题
# (2026-08 审计发现 5 个 ' 2.swift' 让测试 target 断编译逾两周无人知)。
#
# [T-ci-honest-green] 这个文件本身曾是"假绿"的根:
#   xcodebuild ... 2>&1 | tail -30
# 管道的退出码只看最后一条命令(tail 永远成功),所以 xcodebuild 失败
# 时整步仍返回 0,GitHub 显示绿灯 —— 编译失败、测试失败、依赖缺失全被
# 一条 tail 吞掉。绿灯变得毫无意义。修法见下:pipefail + 不截断退出码。
name: LeoPhoneAgent Quality
on:
  push:
    branches: [main, fix/audit-hardening-20260930, fix/mobile-model-management-20261003, feat/paperclip-server-workspace]
    # 触发面放宽:Python 服务、脚本、协议、工作流本身的改动也要能触发,
    # 否则改中继/发布脚本 CI 完全不看,等于没有。
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/audits/**'
      - 'README.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_legacy_mac:
        description: 'Also check the archived leocodebox desktop (not current Mac 1.x)'
        type: boolean
        default: false
# 只读即可:本工作流只跑测试和审计,不写仓库。不声明就继承仓库默认权限,
# 默认可能是可写的 —— android.yml 早就声明了,这里一直漏。
permissions:
  contents: read
jobs:
  ios-unit-tests:
    # 项目 deployment target 是 iOS 26。macos-15 的默认 Xcode 仍是 16.4，
    # 即使逻辑测试本身没问题也会在解析 target 时失败。macos-26 当前自带
    # Xcode 26.6 + iOS 26.5 Simulator，和本机验证矩阵一致。
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS audit tooling
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Audit iOS release, motion and visible controls
        run: |
          set -euo pipefail
          # Independent fixtures must all run so one SDK failure cannot hide
          # another. Keep the step red if any command fails.
          failed=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "Check passed: $*"
            else
              result=$?
              echo "::error::Check failed (exit $result): $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check ./scripts/IOSReleaseReadinessAudit.sh
          run_check ./scripts/IOSAccessibilityMotionAudit.sh
          run_check ./scripts/IOSVisibleControlAudit.sh
          run_check python3 scripts/RepositoryEntryPointAudit.py
          run_check ./scripts/RunCoreSecurityTests.sh
          run_check python3 scripts/CoreExecutionSmoke.py -v
          run_check python3 scripts/CloudKitInboundDurabilityTests.py -v
          run_check bash scripts/CloudKitTransportSDKTypecheck.sh
          run_check python3 scripts/SyncBoundaryTests.py -v
          run_check bash scripts/SkillArchiveCompressionTests.sh
          run_check python3 scripts/SkillTreeTransactionTests.py
          run_check python3 scripts/CloudKitDependencyProgressTests.py
          run_check python3 scripts/SessionFileDeletionPendingTests.py
          run_check python3 scripts/CloudKitUnknownRecordRetentionTests.py
          run_check python3 scripts/SyncSQLiteDurabilityTests.py
          exit "$failed"
      - name: Run MinisTests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail        # 管道里任一命令失败即失败,不被 tail 掩盖
          cd src/ios
          # 逻辑测试必须真正独立于 App/Watch/iSH:这样 CI 既不被缺失的
          # watchOS runtime 卡死，也不依赖尚未发布的本地 iSH submodule commit。
          # 完整 App + 原生依赖另走 release gate，不能拿来替代快速单测。
          xcodebuild test -project LeoPhoneAgent.xcodeproj -scheme MinisLogicTests \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -only-testing:MinisTests CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee /tmp/xcodebuild.log \
            || { echo "::error::xcodebuild test failed"; tail -60 /tmp/xcodebuild.log; exit 1; }
          # 双保险:日志里出现测试失败标记也判红(某些配置下 xcodebuild
          # 退出码不可靠)。
          if grep -qE "Testing failed|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*" /tmp/xcodebuild.log; then
            echo "::error::found failure markers in xcodebuild log"; exit 1
          fi

  paperclip-native-ios:
    name: Paperclip 原生 iOS 中文工作区
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check Paperclip contracts and test harness
        run: |
          set -euo pipefail
          python3 scripts/IOSPaperclipContractAudit.py
          bash -n scripts/native-paperclip-audit/run.sh
      - name: Install native harness project generator
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Compile production Swift and exercise native Chinese journeys
        run: bash scripts/native-paperclip-audit/run.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: paperclip-native-ios
          path: |
            native-paperclip-audit-results/
            !native-paperclip-audit-results/DerivedData/**
          if-no-files-found: warn
          retention-days: 14

  native-model-audit:
    name: Native model UI (${{ matrix.label }})
    # Test-only fixtures, no app signing, credentials, submodules, or releases.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix/mobile-model-management-20261003'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            source_ref: WORKTREE
          - label: baseline
            source_ref: 3c053a7c9b112667a04cea9b12c7c16a03c5ce39
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native harness project generator
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Test production SwiftUI model views on iPhone Simulator
        run: bash scripts/native-model-audit/run.sh '${{ matrix.source_ref }}' '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-model-audit-${{ matrix.label }}
          path: |
            native-model-audit-results/${{ matrix.label }}/
            !native-model-audit-results/${{ matrix.label }}/DerivedData/**
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-model-audit-images-${{ matrix.label }}
          path: |
            native-model-audit-results/${{ matrix.label }}/images/
            native-model-audit-results/${{ matrix.label }}/source-manifest.json
            native-model-audit-results/${{ matrix.label }}/test-summary.json
            native-model-audit-results/${{ matrix.label }}/test-scope.txt
          if-no-files-found: warn
          retention-days: 14

  legacy-mac-quality:
    # Archived desktop remains independently checkable; it is not the current
    # leophone product and cannot supply its green check.
    if: github.event_name == 'workflow_dispatch' && inputs.include_legacy_mac
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/mac/leocodebox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mac/leocodebox/package-lock.json
      - name: Install exact Mac dependencies
        run: npm ci
      - name: Typecheck, lint, test and build Mac app
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
          npm run build


  mac-quality:
    name: Current Mac 1.x source checks
    env:
      ZCODE_ENV: production
      ZCODE_PRODUCT_IDENTITY: leo
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/mac/leophone
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: src/mac/leophone/pnpm-lock.yaml
      - name: Install exact current Mac dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI contracts required by the desktop host
        run: pnpm --filter '@zcode/contracts...' build
      - name: Typecheck current Mac app and CLI
        run: |
          set -euo pipefail
          pnpm typecheck
          PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir apps/zcode-cli typecheck
      - name: Lint and architecture gate
        run: |
          set -euo pipefail
          pnpm lint
          pnpm architecture:check
      - name: Current Mac regression tests
        run: |
          set -euo pipefail
          node scripts/paperclip/typecheck-transport.mjs
          node --import tsx --test packages/desktop/src/main/paperclip/*.test.ts
          node --import tsx --test packages/services/test/paperclipWorkspace.test.ts
          pnpm leo:test:agent
          node --import tsx --test packages/desktop/src/host/leo/link/*.test.ts
          node --import tsx --test packages/ui/test/phonePairingSession.test.ts
      - name: Synthetic phone-pairing component journeys and screenshots
        run: |
          set -euo pipefail
          node node_modules/playwright-core/cli.js install chromium
          node scripts/audit-phone-link/run-journeys.mjs
          node scripts/paperclip-ui/run.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: phone-pairing-synthetic-ui
          path: |
            src/mac/leophone/audit-phone-link-results/
            src/mac/leophone/paperclip-ui-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Build current Mac source (distribution assets gated separately)
        run: |
          set -euo pipefail
          PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir apps/zcode-cli build
          pnpm build:bootstrap

  relay-tests:
    name: Active relay protocol and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install relay test dependencies
        run: python -m pip install aiohttp
      - name: Test relay
        run: PYTHONPATH=src/mac python -m unittest discover -s src/mac/leoagent -t src/mac -p 'test_relay*.py' -v

  harmony-source-tests:
    name: Harmony protocol and source regressions (no native HAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test actual Harmony source with platform IO fixtures
        run: |
          set -euo pipefail
          node src/harmony/protocol/protocol.test.mjs
          node src/harmony/protocol/security-boundaries.test.mjs
          bash src/harmony/scripts/verify_harmony_release_notes.sh
