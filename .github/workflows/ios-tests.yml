# 最小 CI:MinisTests 单测。守住"重复声明进编译目标"这类必炸问题
# (2026-08 审计发现 5 个 ' 2.swift' 让测试 target 断编译逾两周无人知)。
#
# [T-ci-honest-green] 这个文件本身曾是"假绿"的根:
#   xcodebuild ... 2>&1 | tail -30
# 管道的退出码只看最后一条命令(tail 永远成功),所以 xcodebuild 失败
# 时整步仍返回 0,GitHub 显示绿灯 —— 编译失败、测试失败、依赖缺失全被
# 一条 tail 吞掉。绿灯变得毫无意义。修法见下:pipefail + 不截断退出码。
name: LeoPhoneAgent Quality
on:
  push:
    branches: [main, 'fix/audit-hardening-*']
    # 触发面放宽:Python 服务、脚本、协议、工作流本身的改动也要能触发,
    # 否则改中继/发布脚本 CI 完全不看,等于没有。
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_legacy_mac:
        description: 'Also check the archived leocodebox desktop (not current Mac 1.x)'
        type: boolean
        default: false
# 只读即可:本工作流只跑测试和审计,不写仓库。不声明就继承仓库默认权限,
# 默认可能是可写的 —— android.yml 早就声明了,这里一直漏。
permissions:
  contents: read
jobs:
  ios-unit-tests:
    # 项目 deployment target 是 iOS 26。macos-15 的默认 Xcode 仍是 16.4，
    # 即使逻辑测试本身没问题也会在解析 target 时失败。macos-26 当前自带
    # Xcode 26.6 + iOS 26.5 Simulator，和本机验证矩阵一致。
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS audit tooling
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Audit iOS release, motion and visible controls
        run: |
          set -euo pipefail
          ./scripts/IOSReleaseReadinessAudit.sh
          ./scripts/IOSAccessibilityMotionAudit.sh
          ./scripts/IOSVisibleControlAudit.sh
          python3 scripts/RepositoryEntryPointAudit.py
          ./scripts/RunCoreSecurityTests.sh
          python3 scripts/CoreExecutionSmoke.py -v
          python3 scripts/CloudKitInboundDurabilityTests.py -v
          bash scripts/CloudKitTransportSDKTypecheck.sh
          python3 scripts/SyncBoundaryTests.py -v
          bash scripts/SkillArchiveCompressionTests.sh
          python3 scripts/SkillTreeTransactionTests.py
          python3 scripts/CloudKitDependencyProgressTests.py
          python3 scripts/SyncSQLiteDurabilityTests.py
      - name: Run MinisTests
        run: |
          set -euo pipefail        # 管道里任一命令失败即失败,不被 tail 掩盖
          cd src/ios
          # 逻辑测试必须真正独立于 App/Watch/iSH:这样 CI 既不被缺失的
          # watchOS runtime 卡死，也不依赖尚未发布的本地 iSH submodule commit。
          # 完整 App + 原生依赖另走 release gate，不能拿来替代快速单测。
          xcodebuild test -project LeoPhoneAgent.xcodeproj -scheme MinisLogicTests \
            -onlyUsePackageVersionsFromResolvedFile \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -only-testing:MinisTests CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee /tmp/xcodebuild.log \
            || { echo "::error::xcodebuild test failed"; tail -60 /tmp/xcodebuild.log; exit 1; }
          # 双保险:日志里出现测试失败标记也判红(某些配置下 xcodebuild
          # 退出码不可靠)。
          if grep -qE "Testing failed|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*" /tmp/xcodebuild.log; then
            echo "::error::found failure markers in xcodebuild log"; exit 1
          fi

  legacy-mac-quality:
    # Archived desktop remains independently checkable; it is not the current
    # leophone product and cannot supply its green check.
    if: github.event_name == 'workflow_dispatch' && inputs.include_legacy_mac
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/mac/leocodebox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mac/leocodebox/package-lock.json
      - name: Install exact Mac dependencies
        run: npm ci
      - name: Typecheck, lint, test and build Mac app
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
          npm run build


  mac-quality:
    name: Current Mac 1.x source checks
    env:
      ZCODE_ENV: production
      ZCODE_PRODUCT_IDENTITY: leo
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/mac/leophone
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: src/mac/leophone/pnpm-lock.yaml
      - name: Install exact current Mac dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI contracts required by the desktop host
        run: pnpm --filter '@zcode/contracts...' build
      - name: Typecheck current Mac app and CLI
        run: |
          set -euo pipefail
          pnpm typecheck
          PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir apps/zcode-cli typecheck
      - name: Lint and architecture gate
        run: |
          set -euo pipefail
          pnpm lint
          pnpm architecture:check
      - name: Current Mac regression tests
        run: |
          set -euo pipefail
          pnpm leo:test:agent
          node --import tsx --test packages/desktop/src/host/leo/link/*.test.ts
      - name: Build current Mac source (distribution assets gated separately)
        run: |
          set -euo pipefail
          PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir apps/zcode-cli build
          pnpm build:bootstrap

  relay-tests:
    name: Active relay protocol and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install relay test dependencies
        run: python -m pip install aiohttp
      - name: Test relay
        run: PYTHONPATH=src/mac python -m unittest discover -s src/mac/leoagent -t src/mac -p 'test_relay*.py' -v

  harmony-source-tests:
    name: Harmony protocol and source regressions (no native HAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test actual Harmony source with platform IO fixtures
        run: |
          set -euo pipefail
          node src/harmony/protocol/protocol.test.mjs
          node src/harmony/protocol/security-boundaries.test.mjs
          bash src/harmony/scripts/verify_harmony_release_notes.sh
