# GENERATED by scripts/HarmonyCIWorkflow.py - do not edit by hand.
# Change the generator, then: python3 scripts/HarmonyCIWorkflow.py --write
# Source-level HarmonyOS gates only (no DevEco, HAP build, signing or device).
name: HarmonyOS Protocol
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harmony-protocol-tests:
    name: HarmonyOS protocol, UI tokens and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Run Harmony gates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<13)) { console.error("Node "+process.versions.node+" lacks stripTypeScriptTypes"); process.exit(1) }'
          node -e 'if (typeof require("node:module").stripTypeScriptTypes !== "function") process.exit(1)'
          test -x /usr/bin/python3
          files=(src/harmony/protocol/*.test.mjs)
          [ "${#files[@]}" -gt 0 ]
          echo "Harmony protocol test files: ${#files[@]}"
          first_rc=0
          run_check() {
            echo "::group::$*"
            local rc=0
            "$@" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Check passed: $*"
            else
              echo "::error::Check failed (exit $rc): $*"
              if [ "$first_rc" -eq 0 ]; then first_rc=$rc; fi
            fi
            echo "::endgroup::"
          }
          run_check node --test src/harmony/protocol/*.test.mjs
          run_check node src/harmony/scripts/check_ui_tokens.mjs
          run_check bash src/harmony/scripts/verify_harmony_release_notes.sh
          run_check python3 scripts/HarmonyCIWorkflow.py --check
          run_check python3 scripts/RepositoryEntryPointAudit.py
          run_check python3 scripts/RepositoryEntryPointAuditTests.py
          echo "Harmony gates finished; first failing exit: $first_rc"
          exit "$first_rc"
