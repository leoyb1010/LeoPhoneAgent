appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.mock-session-1"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.mock-session-1"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Visual payload fixture"
    timeout: 15000
- tapOn:
    id: "message.mediaPreviewButton"
- extendedWaitUntil:
    visible:
      id: "message.imageLightbox"
    timeout: 10000
- takeScreenshot:
    path: visual-session-payload
