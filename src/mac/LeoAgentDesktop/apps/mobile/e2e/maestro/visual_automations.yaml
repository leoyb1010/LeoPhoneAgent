appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.projectSessionRow"
    timeout: 15000
- openLink:
    link: "${XDT_MOBILE_E2E_HOST_AUTOMATIONS_URL}"
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "automations.screen"
    timeout: 15000
- assertVisible:
    id: "automations.scheduleList"
- assertVisible:
    id: "automations.detailCard"
- assertVisible:
    id: "automations.detailActions"
- takeScreenshot:
    path: visual-automations
- tapOn:
    id: "automations.createButton"
- extendedWaitUntil:
    visible:
      id: "automations.form"
    timeout: 10000
- assertVisible:
    id: "automations.form.nameInput"
- assertVisible:
    id: "automations.form.promptInput"
- assertVisible:
    id: "automations.form.runModeRecurring"
- takeScreenshot:
    path: visual-automations-form
