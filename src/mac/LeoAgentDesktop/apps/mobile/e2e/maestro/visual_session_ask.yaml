appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.visual-ask"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.visual-ask"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- runFlow:
    when:
      visible: "同步失败"
    commands:
      - tapOn:
          id: "connection.syncButton"
- extendedWaitUntil:
    visible:
      id: "interaction.ask.card"
    timeout: 15000
- assertVisible:
    id: "interaction.ask.question"
- assertVisible:
    id: "interaction.ask.option.1"
- takeScreenshot:
    path: visual-session-ask
