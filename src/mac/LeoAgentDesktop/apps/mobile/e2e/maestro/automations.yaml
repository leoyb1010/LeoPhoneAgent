appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- extendedWaitUntil:
    visible:
      id: "home.projectSessionRow"
    timeout: 15000
- openLink:
    link: "${XDT_MOBILE_E2E_HOST_AUTOMATIONS_URL}"
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "automations.screen"
    timeout: 15000
- assertVisible:
    id: "automations.scheduleList"
- assertVisible:
    id: "automations.detailCard"
- assertVisible:
    id: "automations.detailActions"
- tapOn:
    id: "automations.runNowButton"
- extendedWaitUntil:
    visible:
      id: "automations.runList"
    timeout: 10000
- tapOn:
    id: "automations.pauseButton"
- extendedWaitUntil:
    visible:
      id: "automations.pauseDialog"
    timeout: 10000
- assertVisible:
    id: "automations.pause.preview"
- assertVisible:
    id: "automations.pause.actions"
- tapOn:
    id: "automations.pause.confirmButton"
- extendedWaitUntil:
    visible:
      id: "automations.resumeButton"
    timeout: 10000
- tapOn:
    id: "automations.resumeButton"
- extendedWaitUntil:
    visible:
      id: "automations.pauseButton"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "automations.runActions"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "automations.openRunSessionButton"
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "automations.openRunSessionButton"
    timeout: 10000
- tapOn:
    id: "automations.openRunSessionButton"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- assertVisible:
    id: "session.messageList"
