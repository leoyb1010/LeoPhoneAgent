appId: ${APP_ID}
---
- launchApp
- openLink:
    link: "${XDT_MOBILE_E2E_EXPO_URL}"
    optional: true
- waitForAnimationToEnd:
    timeout: 30000
- tapOn:
    text: "XDMaker"
    optional: true
    label: "Open the recent Expo Go XDMaker project if launchApp lands on Expo Home"
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "devices.screen"
    timeout: 10000
- tapOn:
    id: "connection.syncButton"
    optional: true
    label: "Sync devices when the connection row is visible"
- extendedWaitUntil:
    visible:
      id: "home.projectSessionRow"
    timeout: 15000
- tapOn:
    id: "home.projectSessionRow"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- assertVisible:
    id: "session.messageList"
- assertVisible:
    id: "session.summary"
- assertVisible:
    id: "session.attachmentToggleButton"
- assertVisible:
    id: "session.voiceButton"
- assertVisible:
    id: "session.composerInput"
- assertVisible:
    id: "session.sendButton"
