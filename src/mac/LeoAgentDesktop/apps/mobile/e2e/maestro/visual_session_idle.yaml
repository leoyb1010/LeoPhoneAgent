appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.mock-session-1"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.mock-session-1"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "session.messageList"
    timeout: 15000
- assertVisible:
    id: "session.composer"
- takeScreenshot:
    path: visual-session-idle
