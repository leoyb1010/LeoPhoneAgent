appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.visual-running"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.visual-running"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "session.messageList"
    timeout: 15000
- assertVisible:
    text: "Visual Running Session"
- takeScreenshot:
    path: visual-session-running
