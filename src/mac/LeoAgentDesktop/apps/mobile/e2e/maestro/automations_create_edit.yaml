appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- extendedWaitUntil:
    visible:
      id: "home.projectSessionRow"
    timeout: 15000
- openLink:
    link: "${XDT_MOBILE_E2E_HOST_AUTOMATIONS_URL}"
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "automations.screen"
    timeout: 15000
- tapOn:
    id: "automations.createButton"
- extendedWaitUntil:
    visible:
      id: "automations.form"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "automations.templateList"
    timeout: 10000
- tapOn:
    id: "automations.templateCard"
- tapOn:
    id: "automations.form.nameInput"
- eraseText
- inputText: "Mobile Created Automation"
- tapOn:
    id: "automations.form.promptInput"
- inputText: "Run a mobile-created automation"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "automations.form.runModeManual"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "automations.form.runModeManual"
- scrollUntilVisible:
    element:
      id: "automations.form.workspaceDialogue"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "automations.form.workspaceDialogue"
- scrollUntilVisible:
    element:
      id: "automations.form.saveButton"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "automations.form.actions"
- tapOn:
    id: "automations.form.saveButton"
- extendedWaitUntil:
    visible:
      id: "automations.detailCard"
    timeout: 15000
- assertVisible:
    id: "automations.detailActions"
- tapOn:
    id: "automations.deleteButton"
- extendedWaitUntil:
    visible:
      id: "automations.deleteDialog"
    timeout: 10000
- tapOn:
    id: "automations.delete.option.archive"
- assertVisible:
    id: "automations.delete.actions"
- tapOn:
    id: "automations.delete.confirmButton"
- extendedWaitUntil:
    visible:
      id: "automations.scheduleList"
    timeout: 15000
- tapOn:
    id: "automations.editButton"
- extendedWaitUntil:
    visible:
      id: "automations.form"
    timeout: 10000
- tapOn:
    id: "automations.form.nameInput"
- eraseText
- inputText: "Mobile Edited Automation"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "automations.form.saveButton"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "automations.form.saveButton"
- extendedWaitUntil:
    visible:
      id: "automations.detailCard"
    timeout: 15000
