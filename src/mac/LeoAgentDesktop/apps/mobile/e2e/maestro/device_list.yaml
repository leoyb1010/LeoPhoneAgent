appId: ${APP_ID}
---
- launchApp
- openLink:
    link: "${XDT_MOBILE_E2E_EXPO_URL}"
    optional: true
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "devices.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "devices.list"
    timeout: 10000
- assertVisible:
    id: "home.newChatButton"
# 默认是混排模式(groupByProject=false),不会出现 home.projectRow;
# 先打开范围菜单切到「按项目分组」,再断言项目行。
- tapOn:
    id: "devices.title"
- tapOn:
    id: "home.deviceMenu.groupByProject"
- extendedWaitUntil:
    visible:
      id: "home.projectRow"
    timeout: 15000
