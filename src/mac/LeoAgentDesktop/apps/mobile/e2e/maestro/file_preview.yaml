appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- runFlow: open_session_no_launch.yaml
- extendedWaitUntil:
    visible: "Mock image fixture"
    timeout: 10000
- assertVisible:
    id: "message.filePreviewButton"
- tapOn:
    id: "message.filePreviewButton"
- extendedWaitUntil:
    visible:
      id: "message.payloadModal"
    timeout: 10000
- assertVisible:
    id: "message.payloadViewerHeader"
- assertVisible:
    id: "message.payloadViewerBody"
- assertVisible: "mock-spec.md"
- assertVisible:
    id: "message.filePayloadBody"
- assertVisible:
    id: "message.payloadPathActions"
- assertVisible:
    id: "message.copyFilePathButton"
- tapOn:
    id: "message.filePreviewLoadButton"
- extendedWaitUntil:
    notVisible:
      id: "message.filePreviewLoadButton"
    timeout: 10000
- tapOn:
    id: "message.copyFilePathButton"
- extendedWaitUntil:
    visible:
      id: "message.copyFilePathStatus"
    timeout: 5000
- tapOn:
    id: "message.payloadCloseButton"
- tapOn:
    id: "message.filePreviewButton.pdf"
- extendedWaitUntil:
    visible:
      id: "message.fileFallbackStatus.pdf"
    timeout: 10000
- assertVisible:
    id: "message.copyFilePathButton"
- assertVisible:
    id: "message.payloadPathActions"
- tapOn:
    id: "message.payloadCloseButton"
- tapOn:
    id: "message.filePreviewButton.drawio"
- extendedWaitUntil:
    visible:
      id: "message.fileFallbackStatus.drawio"
    timeout: 10000
- assertVisible:
    id: "message.copyFilePathButton"
- assertVisible:
    id: "message.payloadPathActions"
- tapOn:
    id: "message.payloadCloseButton"
- tapOn:
    text: "展开已工作.*"
- extendedWaitUntil:
    visible:
      id: "message.diffPreviewButton"
    timeout: 5000
- tapOn:
    id: "message.diffPreviewButton"
- extendedWaitUntil:
    visible:
      id: "message.diffPayloadBody"
    timeout: 10000
- assertVisible:
    id: "message.copyFilePathButton"
- assertVisible:
    id: "message.payloadPathActions"
- tapOn:
    id: "message.diffFilePreviewLoadButton"
- extendedWaitUntil:
    visible:
      id: "message.diffFilePreviewBlock"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "message.diffFilePreviewReady"
    timeout: 10000
- tapOn:
    id: "message.payloadCloseButton"
