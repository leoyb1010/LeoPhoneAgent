appId: ${APP_ID}
---
- runFlow: login_mock_no_clear.yaml
- assertVisible:
    id: "devices.list"
- extendedWaitUntil:
    visible:
      id: "home.sessionRowTitle.visual-pending"
    timeout: 15000
- tapOn:
    id: "home.sessionRowTitle.visual-pending"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- runFlow:
    when:
      visible: "同步失败"
    commands:
      - tapOn:
          id: "connection.syncButton"
- extendedWaitUntil:
    visible:
      id: "interaction.bottomSurface"
    timeout: 15000
- assertVisible:
    id: "interaction.queuePreview.next"
- assertVisible:
    id: "interaction.plan.card"
- assertVisible:
    id: "interaction.plan.viewerCard"
- assertVisible:
    id: "interaction.plan.actionCard"
- assertVisible:
    id: "interaction.plan.outline"
- takeScreenshot:
    path: visual-session-pending
