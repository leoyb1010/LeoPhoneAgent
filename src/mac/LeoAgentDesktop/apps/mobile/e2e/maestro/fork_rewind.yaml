appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- runFlow: open_session_no_launch.yaml
- runFlow: send_message.yaml
- extendedWaitUntil:
    visible:
      id: "message.userBubble"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "message.rewindButton"
    timeout: 10000
- tapOn:
    id: "message.rewindButton"
- extendedWaitUntil:
    visible:
      id: "rewind.panel"
    timeout: 10000
- tapOn:
    id: "rewind.confirmButton"
- extendedWaitUntil:
    visible:
      id: "session.composerInput"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "message.agentBubble"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "message.forkButton"
    timeout: 10000
- tapOn:
    id: "message.forkButton"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 15000
- assertVisible:
    id: "session.messageList"
