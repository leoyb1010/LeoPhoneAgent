appId: ${APP_ID}
---
- runFlow: login_mock.yaml
- assertVisible:
    id: "devices.list"
- tapOn:
    id: "home.newChatButton"
- extendedWaitUntil:
    visible:
      id: "newSession.firstMessageInput"
    timeout: 15000
- tapOn:
    id: "newSession.firstMessageInput"
- inputText: "Maestro create session ping"
- tapOn:
    id: "newSession.createButton"
- extendedWaitUntil:
    visible:
      id: "session.screen"
    timeout: 20000
- assertVisible:
    id: "session.messageList"
