appId: ${APP_ID}
---
# 手机语音只保留 Cindy 官方托管路径:BYOK Key 录入设置已删除,无需再进设置页。
- runFlow: login_mock.yaml
- runFlow: open_session_no_launch.yaml
- assertVisible:
    id: "session.composerInput"
- tapOn:
    id: "session.voiceButton"
- tapOn:
    text: "^允许$"
    optional: true
    label: "Allow microphone permission on Chinese iOS"
- tapOn:
    text: "^Allow$"
    optional: true
    label: "Allow microphone permission on iOS"
- tapOn:
    text: "^OK$"
    optional: true
    label: "Allow microphone permission on older iOS dialogs"
- extendedWaitUntil:
    visible:
      id: "session.voiceStatus"
    timeout: 15000
- extendedWaitUntil:
    visible: "mock realtime voice draft"
    timeout: 15000
- tapOn:
    id: "session.composerInput"
- extendedWaitUntil:
    visible: "mock refined voice draft"
    timeout: 15000
- assertVisible:
    id: "session.composerInput"
- assertVisible: "mock refined voice draft"
