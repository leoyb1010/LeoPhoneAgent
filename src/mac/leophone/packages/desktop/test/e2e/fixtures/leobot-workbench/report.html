<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>LeoBot · 交互周报样例</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#1a1e26;background:#fff}main{max-width:860px;padding:26px 30px;margin:auto}header{display:flex;justify-content:space-between;border-bottom:1px solid #dce2eb;padding-bottom:14px;font-size:10px;color:#687488}header b{color:#20324c}h1{font-size:30px;line-height:1.25;letter-spacing:-1.1px;margin:28px 0 12px}p{font-size:12px;line-height:1.85;color:#667389;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid #1b2a42;border-bottom:1px solid #dce2eb;margin-top:25px}.stat{padding:18px 0}.stat+.stat{border-left:1px solid #e1e7f0;padding-left:20px}.stat strong{display:block;font-size:27px;font-weight:650;letter-spacing:-1px}.stat span{font-size:10px;color:#687488}.label{display:block;font-size:10px;color:#1761dc;margin-bottom:7px}.brief{margin-top:23px}.brief h2{font-size:15px;letter-spacing:-.2px;margin:0 0 8px}.brief p{font-size:12px}button{margin-top:20px;background:#edf3ff;color:#1656b8;border:1px solid #ccdcf5;border-radius:6px;font:11px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:9px 12px;cursor:pointer}button:hover{background:#e0ebff}button:focus-visible{outline:2px solid #1761dc;outline-offset:3px}#report-details{margin:17px 0 0;padding:0;list-style:none;border-top:1px solid #e1e7f0}li{padding:11px 0;border-bottom:1px solid #e1e7f0;font-size:11px;line-height:1.8;color:#56667e}li b{color:#233957}footer{font-size:9px;color:#8691a2;margin-top:24px} @media(max-width:420px){main{padding:20px}h1{font-size:25px;margin-top:23px}.stat strong{font-size:24px}.stat+.stat{padding-left:15px}header{font-size:9px}} @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><header><b>LEOBOT / 工作简报</b><span>第46周 · 离线样例</span></header><h1>把进展，讲清楚。</h1><p>用一页简报，把本周交付、进行中的工作与待决定事项整理清楚。</p><div class="stats"><div class="stat"><strong>03</strong><span>项工作已交付</span></div><div class="stat"><strong>02</strong><span>项工作进行中</span></div><div class="stat"><strong>01</strong><span>项决定待确认</span></div></div><section class="brief"><span class="label">本周重点</span><h2>先完成最重要的一件事。</h2><p>保持工作台简约，把HTML、代码和文件交付的完整流程做好。</p></section><button id="toggle-details" aria-expanded="false" aria-controls="report-details">展开本周重点</button><ul id="report-details" hidden><li><b>工作台：</b>目标输入和结果优先，低频操作收进更多。</li><li><b>编程：</b>读取、修改、执行、检查形成完整任务流程。</li><li><b>交付：</b>提供可预览、可修改、可下载的原文件。</li></ul><footer>所有数据为演示内容 · 单文件HTML · 可离线打开</footer></main><script>const button=document.getElementById('toggle-details');const details=document.getElementById('report-details');button.addEventListener('click',()=>{details.hidden=!details.hidden;button.setAttribute('aria-expanded',String(!details.hidden));button.textContent=details.hidden?'展开本周重点':'收起本周重点';});</script></body></html>
