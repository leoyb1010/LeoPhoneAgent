<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeoBot</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 72px;
        height: 72px;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        /* [leo] 1.9.0：机器人标志自带浅底和圆角，壳不再垫一层黑色渐变，只留很轻的投影。 */
        background: transparent;
        box-shadow: 0 10px 24px -12px rgb(0 0 0 / 0.25);
        transform: scale(0.94);
        opacity: 0;
        animation: startup-logo-pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo {
        /* [leo] 我们的标志自带底色与圆角,填满整个壳,不再叠一层深色方块。 */
        width: 100%;
        height: 100%;
        border-radius: inherit;
      }

      /* [leo] 启动标志安静地浮现:轻微放大 + 淡入,不再回弹。 */
      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.94);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
